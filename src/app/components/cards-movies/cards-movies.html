<h3 class="genre">
  {{ genre() }}
</h3>
<ul class="movies">
  @for (movie of movies(); track movie.id) {
    <li class="movies__card">
      <img [src]="movie.imageUrl" [alt]="movie.title" />
      <div class="information">
        <h4>{{ movie.title }}</h4>
        <p>{{ movie.duration }} min</p>
      </div>
    </li>
  }
</ul>
